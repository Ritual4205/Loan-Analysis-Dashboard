<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FIR Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f7f9;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background-color: #fff;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #1d3557;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #444;
    }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.2s ease-in-out;
    }

    input:focus, textarea:focus {
      border-color: #1d3557;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    button {
      padding: 12px 20px;
      background-color: #1d3557;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s ease-in-out;
    }

    button:hover {
      background-color: #457b9d;
    }

    #firOutput {
      height: 300px;
      background-color: #f9fafc;
    }

    @media (max-width: 600px) {
      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>FIR Generator Form</h2>

    <label for="name">Your Full Name:</label>
    <input type="text" id="name" placeholder="John Doe" required>

    <label for="address">Your Address:</label>
    <input type="text" id="address" placeholder="123, Main Street, New Delhi" required>

    <label for="station">Police Station:</label>
    <input type="text" id="station" placeholder="Connaught Place Police Station" required>

    <label for="city">City:</label>
    <input type="text" id="city" placeholder="New Delhi" required>

    <label for="subject">Subject of Complaint:</label>
    <input type="text" id="subject" placeholder="Theft in residential area" required>

    <label for="details">Incident Details:</label>
    <textarea id="details" placeholder="Describe the incident..." required></textarea>

    <label for="datetime">Date & Time of Incident:</label>
    <input type="datetime-local" id="datetime" required>

    <label for="location">Location of Incident:</label>
    <input type="text" id="location" placeholder="Near XYZ Park" required>

    <label for="persons">Persons Involved:</label>
    <input type="text" id="persons" placeholder="Name(s) of involved person(s)" required>

    <label for="phone">Your Phone Number:</label>
    <input type="tel" id="phone" placeholder="9876543210" required>

    <div class="buttons">
      <button onclick="generateFIR()">Generate FIR</button>
      <button onclick="downloadFIR()">Download as TXT</button>
      <button onclick="downloadFIRPDF()">Download as PDF</button>
    </div>

    <label for="firOutput">Generated FIR:</label>
    <textarea id="firOutput" readonly></textarea>
  </div>

  <script>
    function generateFIR() {
      const name = document.getElementById('name').value;
      const address = document.getElementById('address').value;
      const station = document.getElementById('station').value;
      const city = document.getElementById('city').value;
      const subject = document.getElementById('subject').value;
      const details = document.getElementById('details').value;
      const datetime = document.getElementById('datetime').value;
      const location = document.getElementById('location').value;
      const persons = document.getElementById('persons').value;
      const phone = document.getElementById('phone').value;
      const today = new Date().toLocaleDateString();

      const firText = `
To,
The Officer-in-Charge,
${station}, ${city}.

Subject: ${subject}

Respected Sir/Madam,

I, ${name}, resident of ${address}, wish to lodge a complaint regarding ${details}.

Date & Time of Incident: ${datetime}
Location: ${location}
Persons Involved: ${persons}

I request you to take necessary action.

Thanking You,

Yours Faithfully,
${name}
Contact: ${phone}
Date: ${today}
      `;

      document.getElementById('firOutput').value = firText.trim();
    }

    function downloadFIR() {
      const text = document.getElementById('firOutput').value;
      const blob = new Blob([text], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'FIR_Template.txt';
      link.click();
    }

    function downloadFIRPDF() {
      const jsPDF = window.jspdf.jsPDF;
      const doc = new jsPDF();
      const text = document.getElementById('firOutput').value;

      const lines = doc.splitTextToSize(text, 180);
      doc.setFont("times", "normal");
      doc.setFontSize(12);
      doc.text(lines, 15, 20);
      doc.save('FIR_Template.pdf');
    }
  </script>

</body>
</html>
